name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rosterops_test
          POSTGRES_USER: rosterops
          POSTGRES_PASSWORD: rosterops_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        working-directory: backend
        run: |
          ruff check .

      - name: Run Mypy Type Check (Strict on Scheduler)
        working-directory: backend
        run: |
          mypy app/scheduler/

      - name: Run Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://rosterops:rosterops_pw@localhost:5432/rosterops_test
          APP_ENV: test
          JWT_SECRET: test-secret-key-at-least-32-chars-long
        run: |
          alembic upgrade head

      - name: Run Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://rosterops:rosterops_pw@localhost:5432/rosterops_test
          APP_ENV: test
          JWT_SECRET: test-secret-key-at-least-32-chars-long
          DEMO_PASSWORD: DemoPass123!
        run: |
          pytest tests/ -v

  frontend:
    name: Frontend Lint, Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: frontend
        run: npm run typecheck

      - name: Production Vite Build
        working-directory: frontend
        run: npm run build

