services:
  db:
    image: postgres:16-alpine
    container_name: rosterops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rosterops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rosterops}
      POSTGRES_DB: ${POSTGRES_DB:-rosterops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rosterops} -d ${POSTGRES_DB:-rosterops}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

