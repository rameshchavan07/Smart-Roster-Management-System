# ------------------------------------------------------------------------------
# Render Blueprint Specification for Smart Roster Management System (RosterOps)
# Conforms to docs/DEPLOYMENT.md §5 and Task T-1002, T-1003
# ------------------------------------------------------------------------------

databases:
  - name: rosterops-db
    databaseName: rosterops
    user: rosterops
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service (Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: rosterops-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rosterops-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: DemoPass123!
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: SOLVER_TIME_LIMIT_S
        value: "20"
      - key: SOLVER_SEED
        value: "42"
      - key: LOG_LEVEL
        value: INFO

  # ----------------------------------------------------------------------------
  # Frontend SPA Web Service (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: rosterops-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: rosterops-api
          envVarKey: RENDER_EXTERNAL_URL
